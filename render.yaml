# Free portfolio demo. Render's free Postgres expires after 30 days.
databases:
  - name: dunganka-db
    plan: free
    region: singapore
    databaseName: dunganka
    user: dunganka
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: dunganka
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/Silviusr/dunganka
    branch: main
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo && python manage.py bootstrap_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 60
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: dunganka-db
          property: connectionString
